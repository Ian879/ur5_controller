# 合并的关节限位（pilz 硬前置：velocity + acceleration 都要有）。
# velocity / position 来自 ur_description/config/ur5/joint_limits.yaml（180°/s、±360°），
# acceleration 来自 ur_moveit_config/config/joint_limits.yaml（5.0 rad/s^2）。
# 加载为 move_group 的 robot_description_planning（见 moveit.launch.py）。
#
# cartesian_limits：pilz CommandPlanner 的 LIN/CIRC 笛卡尔轨迹生成硬前置
# （robot_description_planning.cartesian_limits.*）。Task 2 集成时发现缺这 4 个键会报
# ERROR 级日志且 pilz 无法做直线/圆弧规划。取值用 moveit_setup_framework 官方模板
# （templates/config/pilz_cartesian_limits.yaml）默认值；max_trans_dec 依惯例为负。
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57

joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -2.0944   # -120°（给 OMPL 足够规划空间）
    max_position: 0.5236    # 30°
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
